name: play_hub
description: "Sports Event & Tournament Manager - host and track local badminton, cricket and football tournaments."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase (same project as before: play-hub02)
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0

  # State management, animation, formatting
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/tealBGlogo.png"
  remove_alpha_ios: true
